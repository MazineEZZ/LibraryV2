<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <dialog id="addBookModal">
        <button id="closeModal">close</button>  
        <h2>Add a New Book</h2>
        <form>
            <div>
                <label for="title">Title:</label>
                <input type="text" id="title" name="title">
            </div>
            <div>
                <label for="author">Author:</label>
                <input type="text" id="author" name="author">
            </div>
            <div>
                <label for="pages">Pages:</label>
                <input type="number" id="pages" name="pages" min="1" step="10">
            </div>
            <div class="read-radio">
                <label for="read">Read:</label>
                <div>
                    <input type="radio" id="read" name="isRead" value="yes" checked>
                    <label for="read">Yes</label>
                </div>
                <div>
                    <input type="radio" id="notRead" name="isRead" value="no">
                    <label for="notRead">No</label>
                </div>
            </div>
            <button id="submit">submit</button>
        </form>

    </dialog>
    <header>
        <h1>Library</h1>
        <button class="add-book" id="addBook">Add Book</button>
    </header>
    <main>
        <div class="book-container" id="bookContainer">
        </div>
    </main>
</body>
</html>
